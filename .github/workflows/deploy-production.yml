name: Deploy production

# Chạy tay: Actions → "Deploy production" → Run workflow.
# Environment "production" nên bật "Required reviewers" (Settings → Environments) để có bước duyệt.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Gõ "deploy" để xác nhận đưa bản main hiện tại lên production'
        required: true

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Gọi deploy hook production
        env:
          API_HOOK: ${{ secrets.PRODUCTION_API_DEPLOY_HOOK }}
          WEB_HOOK: ${{ secrets.PRODUCTION_WEB_DEPLOY_HOOK }}
        run: |
          [ -n "$API_HOOK" ] || { echo "::error::Thiếu secret PRODUCTION_API_DEPLOY_HOOK"; exit 1; }
          [ -n "$WEB_HOOK" ] || { echo "::error::Thiếu secret PRODUCTION_WEB_DEPLOY_HOOK"; exit 1; }
          curl -fsS -X POST "$API_HOOK" > /dev/null && echo "Đã kích hoạt deploy API (migrate chạy khi container khởi động)"
          curl -fsS -X POST "$WEB_HOOK" > /dev/null && echo "Đã kích hoạt deploy web"
      - name: Kiểm tra health sau deploy
        env:
          HEALTH_URL: ${{ vars.PRODUCTION_HEALTH_URL }}
        run: |
          [ -n "$HEALTH_URL" ] || { echo "::notice::Chưa đặt biến PRODUCTION_HEALTH_URL — bỏ qua"; exit 0; }
          for i in $(seq 1 30); do
            curl -fsS "$HEALTH_URL" && exit 0
            sleep 20
          done
          echo "::error::API không khỏe sau 10 phút"; exit 1
