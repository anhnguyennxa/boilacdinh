services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodhub
      POSTGRES_PASSWORD: foodhub
      POSTGRES_DB: foodhub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodhub"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://foodhub:foodhub@postgres:5432/foodhub
      REDIS_URL: redis://redis:6379
      WEB_URL: http://web:3000
    ports:
      - "4000:4000"
    volumes:
      # Ảnh món tải lên (khi không dùng Cloudinary) — giữ lại khi tạo lại container
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    profiles: ["full"]

  # Sao lưu hằng ngày lúc 03:00 giờ VN (20:00 UTC) vào ./backups, giữ 14 bản
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: foodhub
      PGPASSWORD: foodhub
      PGDATABASE: foodhub
      BACKUP_KEEP: "14"
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
    entrypoint: ["sh", "-c", "echo '0 20 * * * sh /usr/local/bin/pg-backup.sh' > /etc/crontabs/root && exec crond -f -l 8"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
  uploads:
